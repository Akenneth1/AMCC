<section class="admin-login-wrap">
  <div class="admin-login-box reveal">
    <div style="margin-bottom:30px;">
      <img src="/logo.png" alt="AMC Logo" style="width:80px; margin-bottom:15px; filter: drop-shadow(0 0 10px rgba(200,169,107,0.3));">
      <h2 style="font-family:'Cormorant Garamond',serif; font-size:2.2rem; color:var(--off-white);">Espace <em>Admin</em></h2>
      <p style="color:var(--text-muted); font-size:0.85rem; letter-spacing:0.05em; margin-top:8px;">CONNEXION SÉCURISÉE</p>
    </div>
    
    <form id="adminLoginForm" onsubmit="event.preventDefault(); adminLogin();" style="display:flex; flex-direction:column; gap:20px;">
      <div class="form-group" style="text-align:left;">
        <label for="adminEmail" style="font-size:0.65rem; color:var(--gold); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px; display:block;">Adresse Email</label>
        <input type="email" id="adminEmail" placeholder="nom@exemple.com" required style="background:rgba(255,255,255,0.03); border:1px solid rgba(200,169,107,0.2); color:white; padding:12px 16px; border-radius:4px; outline:none; width:100%;" />
      </div>
      <div class="form-group" style="text-align:left;">
        <label for="adminPassword" style="font-size:0.65rem; color:var(--gold); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px; display:block;">Mot de passe</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required style="background:rgba(255,255,255,0.03); border:1px solid rgba(200,169,107,0.2); color:white; padding:12px 16px; border-radius:4px; outline:none; width:100%;" />
      </div>
      <button class="btn-primary" type="submit" style="width:100%; margin-top:10px; padding:15px;">Se connecter</button>
    </form>
    
    <div style="margin-top:32px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.05);">
      <a onclick="navigate('accueil')" style="font-size:0.75rem; color:var(--text-muted); cursor:pointer; text-decoration:none; transition:0.3s;" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text-muted)'">← Retour au site</a>
    </div>
  </div>
</section>
